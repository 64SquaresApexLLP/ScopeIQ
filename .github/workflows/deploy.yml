# ==============================================================================
# ScopeIQ - Automatic Deployment to EC2 (Windows / NSSM)
#
# Triggered only when code lands on `main` (a merged pull request is a push to `main`).
# Opening or updating a pull request does NOT deploy: there is no pull_request trigger, and the
# job below also refuses to run for one. A manual run is allowed only from `main`.
# Requires a GitHub Actions self-hosted runner installed on the EC2 instance.
#
# HOW TO INSTALL THE SELF-HOSTED RUNNER ON EC2 (one-time setup):
#   1. Go to: https://github.com/64SquaresApexLLP/ScopeIQ
#              > Settings > Actions > Runners > New self-hosted runner
#   2. Select: OS = Windows, Architecture = x64
#   3. Run the PowerShell commands shown by GitHub inside C:\actions-runner
#   4. Register and install as a Windows service:
#        .\config.cmd --url https://github.com/64SquaresApexLLP/ScopeIQ --token <TOKEN>
#        .\svc.cmd install
#        .\svc.cmd start
# ==============================================================================

name: Deploy ScopeIQ to EC2

on:
  push:
    branches:
      - main
    paths-ignore:                     # documentation-only changes need no deployment
      - '**.md'
      - 'docs/**'
  workflow_dispatch:                  # Manual trigger from GitHub Actions UI

concurrency:
  group: deploy-production            # Prevent two deployments running at the same time
  cancel-in-progress: false           # Never cancel a deployment mid-flight

permissions:
  contents: read                      # Grant GITHUB_TOKEN read access to clone/fetch repo

jobs:
  deploy:
    name: Deploy to EC2 (ScopeIQ-API + Frontend)
    runs-on: self-hosted              # Runner registered on the EC2 instance
    # Deploy only for a push to main or a manual run on main - never for a pull request or another branch
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    environment:
      name: production                # Optional: add approval gates in GitHub Environments
      url: https://13.202.236.112     # EC2 Elastic IP shown in the GitHub deployment log

    steps:

      # -------------------------------------------------------------------------
      # STEP 1 - Stop ScopeIQ-API to release file locks (SQLite database, etc.)
      # -------------------------------------------------------------------------
      - name: Stop ScopeIQ-API service to release file locks
        shell: powershell
        run: |
          Write-Host "Stopping ScopeIQ-API service to release database and file locks..."
          Stop-Service -Name "ScopeIQ-API" -Force -ErrorAction SilentlyContinue
          # Terminate any remaining child python processes under C:\ScopeIQ
          Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -like "*C:\ScopeIQ*" } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2
          Write-Host "ScopeIQ-API stopped. All file handles released."

      # -------------------------------------------------------------------------
      # STEP 2 - Safely preserve server SQLite database and discard transient diffs
      # -------------------------------------------------------------------------
      - name: Preserve operational database and clean working directory
        shell: powershell
        run: |
          Set-Location "C:\ScopeIQ"
          Write-Host "Unsetting any assume-unchanged index flags..."
          git update-index --no-assume-unchanged "code/output/scopeiq_local.db" 2>$null

          Write-Host "Safely backing up operational SQLite database..."
          if (Test-Path "code\output\scopeiq_local.db") {
              Copy-Item "code\output\scopeiq_local.db" "C:\ScopeIQ\scopeiq_local.db.bak" -Force
              Remove-Item "code\output\scopeiq_local.db" -Force -ErrorAction SilentlyContinue
          }

          Write-Host "Discarding working tree modifications..."
          git restore --staged . 2>$null
          git restore . 2>$null
          git clean -fd "code/output/sites/" 2>$null
          Write-Host "Working tree cleaned."

      # -------------------------------------------------------------------------
      # STEP 3 - Pull the latest code from main branch & restore operational database
      # -------------------------------------------------------------------------
      - name: Pull latest code from main
        shell: powershell
        run: |
          Set-Location "C:\ScopeIQ"
          Write-Host "Fetching latest main with GitHub token..."
          git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/64SquaresApexLLP/ScopeIQ.git" main
          if ($LASTEXITCODE -ne 0) {
              Write-Error "git fetch failed with exit code $LASTEXITCODE"
              exit 1
          }
          git reset --hard FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
              Write-Error "git reset to FETCH_HEAD failed with exit code $LASTEXITCODE"
              exit 1
          }

          Write-Host "Restoring operational SQLite database from backup..."
          if (Test-Path "C:\ScopeIQ\scopeiq_local.db.bak") {
              Move-Item "C:\ScopeIQ\scopeiq_local.db.bak" "code\output\scopeiq_local.db" -Force
          }

          $commit = git rev-parse --short HEAD
          $msg    = git log -1 --pretty=format:"%s"
          Write-Host "Deployed commit: $commit - $msg"

      # -------------------------------------------------------------------------
      # STEP 4 - Update Python dependencies (safe to run on every deploy)
      # -------------------------------------------------------------------------
      - name: Install / upgrade Python dependencies
        shell: powershell
        run: |
          Write-Host "Installing backend dependencies..."
          & "C:\ScopeIQ\.venv\Scripts\python.exe" -m pip install `
              -r "C:\ScopeIQ\code\backend\requirements.txt" `
              --quiet --no-warn-script-location
          Write-Host "Dependencies up to date."

      # -------------------------------------------------------------------------
      # STEP 5 - Build the Expo web frontend (React Native Web → static bundle)
      # -------------------------------------------------------------------------
      - name: Build Expo web frontend
        shell: powershell
        run: |
          Set-Location "C:\ScopeIQ\code\mobile"
          Write-Host "Installing Node.js dependencies..."
          npm ci --prefer-offline
          Write-Host "Building Expo web export for production..."
          $env:APP_ENV = "prod"
          npx expo export --platform web --output-dir "dist" --clear
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Expo web export failed with exit code $LASTEXITCODE"
              exit 1
          }
          Write-Host "Frontend build complete. Output in C:\ScopeIQ\code\mobile\dist"

      # -------------------------------------------------------------------------
      # STEP 6 - Deploy frontend bundle to IIS (C:\inetpub\wwwroot)
      # -------------------------------------------------------------------------
      - name: Deploy frontend to IIS
        shell: powershell
        run: |
          $src  = "C:\ScopeIQ\code\mobile\dist"
          $dest = "C:\inetpub\wwwroot"

          Write-Host "Removing old static files from IIS root..."
          Get-ChildItem -Path $dest -Exclude "web.config" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Copying new frontend bundle to IIS root..."
          Copy-Item -Path "$src\*" -Destination $dest -Recurse -Force
          Write-Host "Frontend deployed to $dest successfully."

      # -------------------------------------------------------------------------
      # STEP 7 - Start the ScopeIQ-API Windows service
      # -------------------------------------------------------------------------
      - name: Start ScopeIQ-API Windows service
        shell: powershell
        run: |
          Write-Host "Starting ScopeIQ-API service..."
          Start-Service -Name "ScopeIQ-API"
          Start-Sleep -Seconds 5
          $svc = Get-Service -Name "ScopeIQ-API"
          Write-Host "Service status: $($svc.Status)"
          if ($svc.Status -ne "Running") {
              Write-Error "ScopeIQ-API failed to reach Running state after start!"
              exit 1
          }
          Write-Host "ScopeIQ-API is Running."

      # -------------------------------------------------------------------------
      # STEP 8 - Health check: confirm the API responds healthy on port 8010
      # -------------------------------------------------------------------------
      - name: Health check - GET /health
        shell: powershell
        run: |
          $maxRetries = 6
          $delay      = 5
          $url        = "http://127.0.0.1:8010/health"

          for ($i = 1; $i -le $maxRetries; $i++) {
              Write-Host "Health check attempt $i of $maxRetries..."
              try {
                  $response = Invoke-RestMethod -Uri $url -Method GET -TimeoutSec 10
                  Write-Host "Health response: $($response | ConvertTo-Json -Compress)"
                  if ($response.status -eq "ok") {
                      Write-Host "Deployment successful! ScopeIQ API is healthy."
                      exit 0
                  } else {
                      Write-Warning "API returned status '$($response.status)'. Retrying..."
                  }
              } catch {
                  Write-Warning "Request failed: $_"
              }
              Start-Sleep -Seconds $delay
          }

          Write-Error "Health check failed after $maxRetries attempts. Deployment incomplete!"
          exit 1

      # -------------------------------------------------------------------------
      # STEP 9 - Print deployment summary
      # -------------------------------------------------------------------------
      - name: Deployment summary
        if: success()
        shell: powershell
        run: |
          $commit = git -C "C:\ScopeIQ" rev-parse --short HEAD
          $author = git -C "C:\ScopeIQ" log -1 --pretty=format:"%an"
          $msg    = git -C "C:\ScopeIQ" log -1 --pretty=format:"%s"
          Write-Host ""
          Write-Host "========================================"
          Write-Host " ScopeIQ Deployment Complete"
          Write-Host "========================================"
          Write-Host " Commit : $commit"
          Write-Host " Author : $author"
          Write-Host " Message: $msg"
          Write-Host " Service: ScopeIQ-API (NSSM, port 8010)"
          Write-Host " Frontend: IIS (C:\inetpub\wwwroot)"
          Write-Host " Host   : 13.202.236.112 (ap-south-1)"
          Write-Host "========================================"
